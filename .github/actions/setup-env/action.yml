name: "Setup Node + PNPM environment"
description: "Checks out repo, sets up pnpm + node, restores project cache, and installs project dependencies"
runs:
  using: "composite"
  steps:
    - name: Checkout repo
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Setup pnpm
      uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

    - name: Setup node
      uses: actions/setup-node@v7
      with:
        node-version-file: package.json
        cache: pnpm

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: Print versions
      shell: bash
      run: |
        git --version
        node --version
        pnpm --version
