openapi: 3.2.0
info:
  contact:
    email: "contact@bethanyfannin.com"
  title: Noted API
  version: 1.0.0
  description: API for Noted. All paths are relative to the `/api/v1` prefix. Successful JSON responses use a `data` and `meta` envelope. Error responses use an `error` and `meta` envelope. Image uploads use `multipart/form-data`; other request bodies use JSON.

servers:
  - url: /api/v1

tags:
  - name: Authentication
  - name: Account
  - name: Users
  - name: Profiles
  - name: Preferences
  - name: Notes
  - name: Follows
  - name: Likes
  - name: Saves

security:
  - SessionCookie: []

paths:
  /auth/register:
    post:
      tags: [Authentication]
      summary: Register user
      description: Register a user account
      operationId: register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Requests/RegisterRequest"
      responses:
        "201":
          description: User account created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelopes/UserEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /auth/session:
    post:
      tags: [Authentication]
      summary: Login user & create session
      description: Log in and establish an authenticated session
      operationId: createSession
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Requests/LoginRequest"
      responses:
        "200":
          description: Session established
          headers:
            Set-Cookie:
              description: Session cookie set by the server.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelopes/UserEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"
    delete:
      tags: [Authentication]
      summary: Log out; delete session
      description: Log out and invalidate the current session
      operationId: deleteSession
      responses:
        "204":
          description: Session invalidated; response has no body
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /users/account:
    get:
      tags: [Account]
      summary: Get current user account
      description: Get the authenticated user's account details
      operationId: getAccount
      responses:
        "200":
          description: Account details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelopes/UserEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"
    patch:
      tags: [Account]
      summary: Update account details
      description: Update specific account details for the authenticated user
      operationId: updateAccount
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Requests/UpdateAccountRequest"
      responses:
        "200":
          description: Account updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelopes/UserEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /users:
    get:
      tags: [Users]
      description: List all public users as an array; showing a summary for each user including their user id, username, and profile image.
      summary: List users
      operationId: listUsers
      security: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Public users; an empty collection is returned when none exist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelopes/UserSummaryListEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /users/{userId}:
    parameters:
      - $ref: "#/components/parameters/UserId"
    get:
      tags: [Users]
      description: Get basic information about a user by their user ID
      summary: Get user by ID
      security: []
      operationId: getUser
      responses:
        "200":
          description: User information
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelopes/UserSummaryEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /users/{userId}/profile:
    parameters:
      - $ref: "#/components/parameters/UserId"
    get:
      tags: [Profiles]
      summary: Get a user's public profile
      security: []
      description: Get a user's public profile information (name, bio, summary, keywords, profileImage, profile creation date and date of last profile update) using their user id
      operationId: getPublicProfile
      responses:
        "200":
          description: Public profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelopes/ProfileWithUserEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /users/profile:
    get:
      tags: [Profiles]
      summary: Get the authenticated user's profile
      description: Get the public profile of the currently authenticated user
      operationId: getOwnProfile
      responses:
        "200":
          description: Own profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelopes/ProfileWithUserEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
    put:
      tags: [Profiles]
      summary: Create or replace the authenticated user's profile
      description: Replaces the profile. `profileImage` is an uploaded image file; `profileImageUri` is returned by read operations. Use `resetProfileImage` to restore the default image. Do not send both `profileImage` and `resetProfileImage` in the same request.

      operationId: replaceOwnProfile
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/Requests/ReplaceProfileRequest"
            encoding:
              profileImage:
                contentType: image/*
      responses:
        "200":
          description: Profile replaced
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelopes/ProfileEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
    patch:
      tags: [Profiles]
      summary: Update selected profile fields
      description: Only supplied fields are changed. `profileImage` is an uploaded image file; `profileImageUri` is returned by read operations. Use `resetProfileImage` to restore the default image. Do not send both `profileImage` and `resetProfileImage` in the same request.
      operationId: updateOwnProfile
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/Requests/UpdateProfileRequest"
            encoding:
              profileImage:
                contentType: image/*
      responses:
        "200":
          description: Profile updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelopes/ProfileEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /users/preferences:
    get:
      tags: [Preferences]
      summary: Get the authenticated user's preferences
      description: Get the preferences for the currently authenticated user.
      operationId: getPreferences
      responses:
        "200":
          description: Account preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelopes/PreferencesEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"
    patch:
      tags: [Preferences]
      summary: Update the authenticated user's preferences
      description: Update the currently authenticated user's preferences
      operationId: updatePreferences
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Requests/UpdatePreferencesRequest"
      responses:
        "200":
          description: Preferences updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelopes/PreferencesEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /notes:
    post:
      tags: [Notes]
      summary: Create a note
      description: Create a new note; only required fields are title and content
      operationId: createNote
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/Requests/CreateNoteRequest"
            encoding:
              headerImage:
                contentType: image/*
      responses:
        "201":
          description: Note created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelopes/NoteEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
    get:
      tags: [Notes]
      summary: List the authenticated user's notes
      description: Returns note summaries, newest first. An empty collection is returned when the user has no notes.
      operationId: listOwnNotes
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: The authenticated user's notes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelopes/NoteSummaryListEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /notes/explore:
    get:
      tags: [Notes]
      summary: List public notes from other users
      description: Explore feed with optional pagination, tag, and author filters.
      operationId: exploreNotes
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
        - name: tag
          in: query
          description: Filter notes by tag.
          schema:
            type: string
        - name: authorId
          in: query
          description: Filter notes by author.
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Public notes for the Explore feed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelopes/NoteSummaryListEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /notes/{noteId}:
    parameters:
      - $ref: "#/components/parameters/NoteId"
    get:
      tags: [Notes]
      summary: Get a note, including its Markdown content
      description: Public notes can be read without authentication. A private note can only be read by its owner. Return 404 for a private note when the requester is not its owner so its existence is not disclosed.
      operationId: getNote
      security:
        - SessionCookie: []
        - {}
      responses:
        "200":
          description: Note details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelopes/NoteEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
    patch:
      tags: [Notes]
      summary: Update a note owned by the authenticated user
      description: Only supplied fields are changed. `headerImage` is an uploaded image file. Use `removeHeaderImage` to remove the existing header image. Do not upload `headerImage` and set `removeHeaderImage` to true in the same request.
      operationId: updateNote
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/Requests/UpdateNoteRequest"
            encoding:
              headerImage:
                contentType: image/*
      responses:
        "200":
          description: Note updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelopes/NoteEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
    delete:
      tags: [Notes]
      summary: Delete a note owned by the authenticated user
      description: Delete a note owned by the authenticated user that matches the id in the URL parameter
      operationId: deleteNote
      responses:
        "204":
          description: Note deleted; response has no body
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /users/{userId}/follow:
    parameters:
      - $ref: "#/components/parameters/UserId"
    put:
      tags: [Follows]
      summary: Follow a user
      description: Allows the currently authenticated user to follow another user with a user id which matches the URL parameter
      operationId: followUser
      responses:
        "204":
          description: User followed; response has no body
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
    delete:
      tags: [Follows]
      summary: Unfollow a user
      description: Removes a user whose user id matches the id given in the URL parameter from the currently authenticated user's "Following" list
      operationId: unfollowUser
      responses:
        "204":
          description: User unfollowed; response has no body
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /users/following:
    get:
      tags: [Follows]
      summary: List users followed by the authenticated user
      description: List all users followed by the authenticated user
      operationId: listFollowing
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Following list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelopes/UserSummaryListEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /users/followers:
    get:
      tags: [Follows]
      summary: List the authenticated user's followers
      description: List the authenticated user's followers; provides a summary of each user who follows the authenticated user (including their user id, username, and profile image)
      operationId: listFollowers
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Followers list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelopes/UserSummaryListEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /notes/{noteId}/like:
    parameters:
      - $ref: "#/components/parameters/NoteId"
    put:
      tags: [Likes]
      summary: Like a note
      description: A user may like a public note written by another user or by themselves.
      operationId: likeNote
      responses:
        "204":
          description: Note liked; response has no body
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
    delete:
      tags: [Likes]
      summary: Remove a like from a note
      description: Removes a like from the authenticated user from the note whose id matches the note id given in the URL parameter
      operationId: unlikeNote
      responses:
        "204":
          description: Like removed; response has no body
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /notes/saved:
    get:
      tags: [Saves]
      summary: List saved notes
      description: List a summary (title, author, tags, header image, creation date and last updated date) of each note the authenticated user has saved
      operationId: listSavedNotes
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Saved notes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelopes/NoteSummaryListEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /notes/{noteId}/save:
    parameters:
      - $ref: "#/components/parameters/NoteId"
    put:
      tags: [Saves]
      summary: Save a note
      description: A user may save their own note or a note written by another user.
      operationId: saveNote
      responses:
        "204":
          description: Note saved; response has no body
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
    delete:
      tags: [Saves]
      summary: Remove a saved note
      description: Removes the note whose id matches the note id given in the URL parameter from the authenticated user's list of saved notes
      operationId: unsaveNote
      responses:
        "204":
          description: Note removed from saved notes; response has no body
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
components:
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: session
      description: Authenticated requests use the session cookie. Replace `session` with the configured cookie name if the server uses a different name.
  parameters:
    UserId:
      name: userId
      in: path
      required: true
      description: Numeric user identifier.
      schema:
        type: integer
        minimum: 1
    NoteId:
      name: noteId
      in: path
      required: true
      description: Numeric note identifier.
      schema:
        type: integer
        minimum: 1
    Page:
      name: page
      in: query
      description: Page number (1-based).
      schema:
        type: integer
        minimum: 1
        default: 1
    Limit:
      name: limit
      in: query
      description: Maximum number of items to return.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
  responses:
    BadRequest:
      description: Invalid input or malformed request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Envelopes/ErrorEnvelope"
    Unauthorized:
      description: Authentication is missing or invalid
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Envelopes/ErrorEnvelope"
    NotFound:
      description: Resource not found or hidden because the requester lacks access
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Envelopes/ErrorEnvelope"
    Conflict:
      description: Request conflicts with the current resource state
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Envelopes/ErrorEnvelope"
    InternalServerError:
      description: Unexpected server failure
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Envelopes/ErrorEnvelope"
  schemas:
    Core:
      Id:
        type: integer
        minimum: 1
      Username:
        type: string
        minLength: 3
        maxLength: 20
      Password:
        type: string
        format: password
        minLength: 8
      Email:
        type: string
        format: email
      NoteTitle:
        type: string
        maxLength: 100
      NoteContent:
        type: string
        description: Markdown content.
      Tags:
        type: array
        items:
          type: string
      Visibility:
        type: string
        enum: [public, private]
      Summary:
        type: string
      Bio:
        type: string
      Keywords:
        type: array
        items:
          type: string
      DateTime:
        type: string
        format: date-time
      ImageUri:
        type: string
        format: uri
      Pagination:
        type: object
        properties:
          page:
            type: integer
            minimum: 1
          limit:
            type: integer
            minimum: 1
          total:
            type: integer
            minimum: 0
          hasMore:
            type: boolean
        additionalProperties: false
    Users:
      User:
        type: object
        required:
          - id
          - username
          - email
          - createdAt
          - updatedAt
        properties:
          id:
            $ref: "#/components/schemas/Core/Id"
          username:
            $ref: "#/components/schemas/Core/Username"
          email:
            $ref: "#/components/schemas/Core/Email"
          profileImageUri:
            $ref: "#/components/schemas/Core/ImageUri"
          createdAt:
            $ref: "#/components/schemas/Core/DateTime"
          updatedAt:
            $ref: "#/components/schemas/Core/DateTime"
        additionalProperties: false
      UserSummary:
        type: object
        required:
          - id
          - username
        properties:
          id:
            $ref: "#/components/schemas/Core/Id"
          username:
            $ref: "#/components/schemas/Core/Username"
          profileImageUri:
            $ref: "#/components/schemas/Core/ImageUri"
        additionalProperties: false
    Profile:
      type: object
      required:
        - name
        - summary
        - bio
        - keywords
        - createdAt
        - updatedAt
      properties:
        name:
          type: string
        summary:
          $ref: "#/components/schemas/Core/Summary"
        bio:
          $ref: "#/components/schemas/Core/Bio"
        keywords:
          $ref: "#/components/schemas/Core/Keywords"
        profileImageUri:
          $ref: "#/components/schemas/Core/ImageUri"
        createdAt:
          $ref: "#/components/schemas/Core/DateTime"
        updatedAt:
          $ref: "#/components/schemas/Core/DateTime"
      additionalProperties: false
    Preferences:
      type: object
      required:
        - visibility
        - createdAt
        - updatedAt
      properties:
        visibility:
          $ref: "#/components/schemas/Core/Visibility"
        createdAt:
          $ref: "#/components/schemas/Core/DateTime"
        updatedAt:
          $ref: "#/components/schemas/Core/DateTime"
      additionalProperties: false
    Notes:
      Author:
        type: object
        required:
          - id
          - username
        properties:
          id:
            $ref: "#/components/schemas/Core/Id"
          username:
            $ref: "#/components/schemas/Core/Username"
          profileImageUri:
            $ref: "#/components/schemas/Core/ImageUri"
        additionalProperties: false
      Note:
        type: object
        required:
          - id
          - title
          - content
          - author
          - tags
          - visibility
          - createdAt
          - updatedAt
        properties:
          id:
            $ref: "#/components/schemas/Core/Id"
          title:
            $ref: "#/components/schemas/Core/NoteTitle"
          content:
            $ref: "#/components/schemas/Core/NoteContent"
          author:
            $ref: "#/components/schemas/Notes/Author"
          headerImageUri:
            $ref: "#/components/schemas/Core/ImageUri"
          tags:
            $ref: "#/components/schemas/Core/Tags"
          visibility:
            $ref: "#/components/schemas/Core/Visibility"
          createdAt:
            $ref: "#/components/schemas/Core/DateTime"
          updatedAt:
            $ref: "#/components/schemas/Core/DateTime"
        additionalProperties: false
      NoteSummary:
        type: object
        required:
          - id
          - title
          - author
          - tags
          - createdAt
          - updatedAt
        properties:
          id:
            $ref: "#/components/schemas/Core/Id"
          title:
            $ref: "#/components/schemas/Core/NoteTitle"
          author:
